plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.example.basswake'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.basswake"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
